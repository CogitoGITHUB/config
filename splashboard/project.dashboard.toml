# ── Widgets ────────────────────────────────────────────────────────

[[widget]]
id = "greeting"
fetcher = "basic_static"
format = "🌹 Well, well, well.. Welcome back, Shape! 🌹"
render = { type = "text_plain", align = "center", color = "text_secondary" }

[[widget]]
id = "name"
fetcher = "git_repo_name"
render = { type = "text_plain", align = "center", color = "panel_title" }

[[widget]]
id = "tag"
fetcher = "git_latest_tag"
shape = "text"
render = { type = "text_plain", align = "center" }


[[widget]]
id = "title_commits"
fetcher = "basic_static"
format = "🌹 Recent Changes 🌹"
render = { type = "text_plain", align = "center", color = "text_secondary" }

[[widget]]
id = "recent"
fetcher = "git_recent_commits"
shape = "text_block"
format = "5"
render = { type = "animated_splitflap", align = "center", duration_ms = 200 }

[[widget]]
id = "status"
fetcher = "git_status"
shape = "entries"
render = { type = "animated_splitflap", layout = "rows", column_align = ["left", "right"], duration_ms = 200 }

# ── Layout ─────────────────────────────────────────────────────────

[[row]]
height = { fill = 1 }

[[row]]
height = { length = 1 }
flex = "center"
  [[row.child]]
  widget = "greeting"
  width = { length = 70 }

[[row]]
height = { length = 1 }

[[row]]
height = { length = 1 }
flex = "center"
  [[row.child]]
  widget = "name"
  width = { length = 70 }

[[row]]
height = { length = 1 }

[[row]]
height = { length = 1 }
flex = "center"
  [[row.child]]
  widget = "tag"
  width = { length = 70 }

[[row]]
height = { length = 1 }

[[row]]
height = { length = 1 }
flex = "center"
  [[row.child]]
  widget = "title_commits"
  width = { length = 70 }

[[row]]
height = { length = 5 }
flex = "center"
  [[row.child]]
  widget = "recent"
  width = { length = 70 }

[[row]]
height = { length = 1 }

[[row]]
height = { length = 7 }
flex = "center"
  [[row.child]]
