# ── Widgets ────────────────────────────────────────────────────────

[[widget]]
id = "quote"
fetcher = "basic_static"
shape = "text_block"
format = "🌹 \"L'enfer, c'est les autres\" 🌹"
render = { type = "animated_splitflap", align = "center", color = "text_secondary", duration_ms = 200 }

[[widget]]
id = "greeting"
fetcher = "basic_static"
format = "🌹 Well, well, well.. Welcome back, Shape! 🌹"
render = { type = "text_plain", align = "center", color = "text_secondary" }

[[widget]]
id = "hero"
fetcher = "clock"
format = "%H:%M"
render = { type = "text_ascii", style = "blocks", pixel_size = "full", color = "panel_title", align = "center" }

[[widget]]
id = "date"
fetcher = "clock"
format = "%A  ·  %e %B %Y  ·  day %j of %Y"
render = { type = "text_plain", align = "center" }

[[widget]]
id = "sartre_title"
fetcher = "basic_static"
format = "🌹 Jean-Paul Sartre 🌹"
render = { type = "text_plain", align = "center", color = "text_secondary" }

[[widget]]
id = "world_clock"
fetcher = "clock_timezones"
format = "%H:%M"
shape = "text_block"
render = { type = "animated_splitflap", align = "center", duration_ms = 200 }
  [widget.options]
  timezones = [
    { tz = "Europe/Bucharest", label = "Bucharest" },
    { tz = "Asia/Tokyo", label = "Tokyo" },
    { tz = "Asia/Seoul", label = "Seoul" },
    { tz = "America/New_York", label = "NYC" },
  ]

[[widget]]
id = "title_world_clock"
fetcher = "basic_static"
format = "🌹 World Clock 🌹"
render = { type = "text_plain", align = "center", color = "text_secondary" }

