# ── Widgets ────────────────────────────────────────────────────────

[[widget]]
id = "quote"
fetcher = "basic_static"
shape = "text_block"
format = "🌹 \"L'enfer, c'est les autres\" 🌹"
render = { type = "animated_splitflap", align = "center", color = "text_secondary" }

[[widget]]
id = "greeting"
fetcher = "basic_static"
format = "🌹 Good Evening 🌹"
render = { type = "animated_typewriter", align = "center", color = "text_secondary" }

[[widget]]
id = "hero"
fetcher = "clock"
format = "%H:%M"
render = { type = "text_ascii", style = "blocks", pixel_size = "full", color = "panel_title", align = "center" }

[[widget]]
id = "date"
fetcher = "clock"
format = "%A  ·  %e %B %Y  ·  day %j of %Y"
render = { type = "animated_typewriter", align = "center" }




# ── Weather ─────────────────────────────────────────────────────────
# Change lat/lon to your location. Tokyo and Seoul are fixed.

[[widget]]
id = "weather_title"
fetcher = "basic_static"
format = "🌹 Weather 🌹"
render = { type = "animated_typewriter", align = "center", color = "panel_title" }

[[widget]]
id = "system_name"
fetcher = "system_info_host"
kind = "os"
render = { type = "text_plain", align = "center" }

[[widget]]
id = "sartre_title"
fetcher = "basic_static"
format = "🌹 Jean-Paul Sartre 🌹"
render = { type = "animated_typewriter", align = "center", color = "text_secondary" }

[[widget]]
id = "world_clock"
fetcher = "clock_timezones"
format = "%H:%M"
shape = "text_block"
render = { type = "animated_splitflap", align = "center" }
  [widget.options]
  timezones = [
    { tz = "Europe/Bucharest", label = "Bucharest" },
    { tz = "Asia/Tokyo", label = "Tokyo" },
    { tz = "Asia/Seoul", label = "Seoul" },
    { tz = "America/New_York", label = "NYC" },
  ]

[[widget]]
id = "title_world_clock"
fetcher = "basic_static"
format = "🌹 World Clock 🌹"
render = { type = "animated_typewriter", align = "center", color = "text_secondary" }

[[widget]]
id = "title_home"
fetcher = "basic_static"
format = "🌹 Home 🌹"
render = { type = "animated_typewriter", align = "center", color = "text_secondary" }

[[widget]]
id = "title_tokyo"
fetcher = "basic_static"
format = "🌹 Tokyo 🌹"
render = { type = "animated_typewriter", align = "center", color = "text_secondary" }

[[widget]]
id = "title_seoul"
fetcher = "basic_static"
format = "🌹 Seoul 🌹"
render = { type = "animated_typewriter", align = "center", color = "text_secondary" }

[[widget]]
id = "title_nyc"
fetcher = "basic_static"
format = "🌹 NYC 🌹"
render = { type = "animated_typewriter", align = "center", color = "text_secondary" }

[[widget]]
id = "title_crypto"
fetcher = "basic_static"
format = "🌹 Crypto 🌹"
render = { type = "animated_typewriter", align = "center", color = "text_secondary" }

[[widget]]
id = "title_stocks"
fetcher = "basic_static"
format = "🌹 Stocks 🌹"
render = { type = "animated_typewriter", align = "center", color = "text_secondary" }

[[widget]]
id = "weather_home"
fetcher = "weather"
render = { type = "animated_splitflap", layout = "rows", column_align = ["left", "right"] }
  [widget.options]
  latitude = 45.44
  longitude = 28.05
  units = "metric"

[[widget]]
id = "weather_tokyo"
fetcher = "weather"
render = { type = "animated_splitflap", layout = "rows", column_align = ["left", "right"] }
  [widget.options]
  latitude = 35.6762
  longitude = 139.6503
  units = "metric"

[[widget]]
id = "weather_seoul"
fetcher = "weather"
render = { type = "animated_splitflap", layout = "rows", column_align = ["left", "right"] }
  [widget.options]
  latitude = 37.5665
  longitude = 126.9780
  units = "metric"

[[widget]]
id = "weather_nyc"
fetcher = "weather"
render = { type = "animated_splitflap", layout = "rows", column_align = ["left", "right"] }
  [widget.options]
  latitude = 40.71
  longitude = -74.01
  units = "metric"



# ── Crypto ──────────────────────────────────────────────────────────

[[widget]]
id = "crypto"
fetcher = "crypto_watchlist"
render = { type = "animated_splitflap", layout = "rows", column_align = ["left", "right"] }
  [widget.options]
  coins = ["bitcoin", "monero", "ethereum", "solana"]
  vs_currency = "usd"

# ── Stocks ──────────────────────────────────────────────────────────

[[widget]]
id = "stocks"
fetcher = "stock_watchlist"
render = { type = "animated_splitflap", layout = "rows", column_align = ["left", "right"] }
  [widget.options]
  symbols = ["TSLA", "SPCX", "AAPL", "MSFT", "GOOG"]


