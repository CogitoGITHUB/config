# Written by `splashboard install`. User preferences that apply to every dashboard.
# Safe to edit by hand. Re-running `splashboard install` leaves this file alone
# unless you pass `--yes`, which backs it up as `settings.toml.bak` before rewriting.

[theme]
bg = "#ffffff"
bg_subtle = "#ffffff"
text = "#FFFFFF"
text_secondary = "#FFFFFF"
text_dim = "#FFFFFF"
panel_title = "#FFFFFF"
panel_border = "#FFFFFF"
status_ok = "#FFFFFF"
status_warn = "#FFFFFF"
status_error = "#FFFFFF"
accent_today = "#FFFFFF"
accent_event = "#FFFFFF"
palette_series = ["#FFFFFF", "#FFFFFF", "#FFFFFF", "#FFFFFF"]
palette_heatmap = ["#FFFFFF", "#FFFFFF", "#FFFFFF", "#FFFFFF", "#FFFFFF"]

