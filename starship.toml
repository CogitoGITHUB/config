# 🌹 ManifoldOS Starship — Garden Theme
add_newline = true
command_timeout = 800

format = """$git_status🌹
"""

right_format = ""

# ── Git Status ─────────────────────────────────────────────
[git_status]
style = "#6B0000"
format = '([$all_status$ahead_behind]($style) )'
conflicted  = "🥀 "
ahead       = "↑$count "
behind      = "↓$count "
diverged    = "🥀🥀 "
untracked   = "? "
stashed     = "↪ "
modified    = "~$count "
staged      = "+$count "
renamed     = "» "
deleted     = "🥀$count "

# ── Disabled ───────────────────────────────────────────────
[git_branch]
disabled = true

# ── Disabled ───────────────────────────────────────────────
[directory]
disabled = true

[cmd_duration]
disabled = true

[character]
disabled = true

[time]
disabled = true

[username]
disabled = true

[hostname]
disabled = true

[battery]
disabled = true

[memory_usage]
disabled = true

[jobs]
disabled = true